name: Build BMW MN-Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7 (no wrapper needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build both debug APKs (standard + systemuid)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Lint both debug variants
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Upload standard APK
        uses: actions/upload-artifact@v4
        with:
          name: BMW-MN-Launcher
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Upload SystemUID APK
        uses: actions/upload-artifact@v4
        with:
          name: BMW-MN-Launcher-SystemUID
          path: app/build/outputs/apk/systemuid/debug/*.apk
          if-no-files-found: error
